name: evaluacion-prompts

on:
  push:
    branches: [main, "lab09-*"]
  pull_request:
    branches: [main]

jobs:
  evaluar-prompts:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      PROMPTFOO_DISABLE_TELEMETRY: "1"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pytest pyyaml

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ejecutar evaluaciones promptfoo (offline con proveedor grabado)
        run: |
          set -euo pipefail
          echo "=== Verificacion de entorno ==="
          node --version
          python -c "from src.consultas.ia import ProveedorLLM; print('ProveedorLLM OK:', ProveedorLLM)"

          echo "=== Ejecutando promptfoo criterios (Tarea A) ==="
          npx --yes promptfoo@0.126.0 eval --no-cache \
            -c prompts/criterios/promptfooconfig.yaml \
            -o /tmp/eval_criterios.json \
            || echo "promptfoo criterios finalizo con codigo != 0 (esperado por v1/v2)"
          test -s /tmp/eval_criterios.json

          echo "=== Ejecutando promptfoo pruebas_eta (Tarea B) ==="
          npx --yes promptfoo@0.126.0 eval --no-cache \
            -c prompts/pruebas_eta/promptfooconfig.yaml \
            -o /tmp/eval_pruebas_eta.json \
            || echo "promptfoo pruebas_eta finalizo con codigo != 0 (esperado por v1/v2)"
          test -s /tmp/eval_pruebas_eta.json

          ls -lh /tmp/eval_criterios.json /tmp/eval_pruebas_eta.json

      - name: Compuerta de calidad (Quality Gate) para prompts
        run: python prompts/quality_gate.py

      - name: Ejecutar pruebas de integracion del generador de criterios
        run: python -m pytest -v tests/test_generador_prompts.py

      - name: Subir resultados de evaluacion como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-eval-results
          path: |
            /tmp/eval_criterios.json
            /tmp/eval_pruebas_eta.json
          if-no-files-found: warn

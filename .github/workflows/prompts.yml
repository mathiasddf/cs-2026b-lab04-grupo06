name: evaluacion-prompts

on:
  push:
    branches: [main, "lab09-*"]
  pull_request:
    branches: [main]

jobs:
  evaluar-prompts:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pytest

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ejecutar evaluaciones promptfoo (offline con proveedor grabado)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "=== Python path check ==="
          python -c "import sys; print('sys.path:', sys.path[:3])"
          python -c "from src.consultas.ia import ProveedorLLM; print('ProveedorLLM OK:', ProveedorLLM)"
          echo "=== Ejecutando promptfoo criterios ==="
          npx --yes promptfoo@0.126.0 eval --no-cache \
            -c prompts/criterios/promptfooconfig.yaml \
            -o /tmp/eval_criterios.json \
            && echo "Criterios OK" || echo "Criterios terminó con error (intencionado para v1/v2)"
          echo "=== Ejecutando promptfoo pruebas_eta ==="
          npx --yes promptfoo@0.126.0 eval --no-cache \
            -c prompts/pruebas_eta/promptfooconfig.yaml \
            -o /tmp/eval_pruebas_eta.json \
            && echo "Pruebas ETA OK" || echo "Pruebas ETA terminó con error (intencionado para v1/v2)"
          echo "=== Verificar archivos generados ==="
          ls -lh /tmp/eval_criterios.json /tmp/eval_pruebas_eta.json || echo "ADVERTENCIA: algún archivo faltante"

      - name: Compuerta de calidad (Quality Gate) para prompts
        run: |
          python -c '
          import json
          import os
          import sys

          def verificar_evaluacion(ruta_archivo, nombre_tarea, version_esperada, total_esperado=8):
              if not os.path.exists(ruta_archivo):
                  print(f"[ERROR] No se encontro el archivo de evaluacion {ruta_archivo}")
                  return False

              with open(ruta_archivo, "r", encoding="utf-8") as f:
                  data = json.load(f)

              prompts = data.get("results", {}).get("prompts", [])
              print("\n" + "=" * 60)
              print(f" Resumen de Evaluacion: {nombre_tarea}")
              print("=" * 60)

              mejor_version_ok = False
              for p in prompts:
                  label = p.get("label") or p.get("display") or ""
                  first_line = label.split("\n")[0][:75]
                  metrics = p.get("metrics", {})
                  passed = metrics.get("testPassCount", 0)
                  failed = metrics.get("testFailCount", 0)
                  total = passed + failed
                  pct = (passed / total) * 100 if total > 0 else 0
                  print(f" * {first_line}: {passed}/{total} ({pct:.1f} %)")

                  es_target = False
                  if version_esperada == "v3.1.txt" and "v3.1.txt" in label:
                      es_target = True
                  elif version_esperada == "v3.txt" and "v3.txt" in label and "v3.1" not in label:
                      es_target = True

                  if es_target:
                      if passed == total_esperado and failed == 0:
                          print(f"   --> GATE APROBADO: {version_esperada} alcanzo {passed}/{total_esperado} (100.0 %)")
                          mejor_version_ok = True
                      else:
                          print(f"   --> GATE FALLIDO: {version_esperada} obtuvo {passed}/{total_esperado} (fallaron {failed})")

              return mejor_version_ok

          ok_a = verificar_evaluacion("/tmp/eval_criterios.json", "Tarea A - Criterios INVEST", "v3.1.txt")
          ok_b = verificar_evaluacion("/tmp/eval_pruebas_eta.json", "Tarea B - Pruebas Pytest ETA", "v3.txt")

          if not ok_a or not ok_b:
              print("\n[FALLO] La compuerta de calidad de prompts no se cumplio.")
              sys.exit(1)

          print("\n[EXITO] Compuerta de calidad superada al 100% para Tarea A (v3.1) y Tarea B (v3).")
          '

      - name: Ejecutar pruebas de integracion del generador de criterios
        run: |
          python -m pytest -v tests/test_generador_prompts.py

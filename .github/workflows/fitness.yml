name: fitness-functions

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  arquitectura:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de arquitectura y pruebas
        run: |
          python -m pip install --upgrade pip
          python -m pip install import-linter pytest matplotlib radon jsonschema

      - name: Ejecutar Fitness Functions Estructurales (FF-01 y FF-02)
        run: lint-imports

      - name: Ejecutar Fitness Functions de Calidad (FF-03 a FF-06) y Regresion Lab 07
        run: |
          python -m pytest -v tests/test_fitness.py tests/test_comportamiento.py tests/test_patrones.py

  evaluar-prompts:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar promptfoo
        run: npm install -g promptfoo

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema

      - name: Evaluar prompts - Criterios INVEST (Tarea A)
        run: |
          cd prompts/criterios
          promptfoo eval --config promptfooconfig.yaml --output /tmp/eval_criterios.json --no-cache
        env:
          PROMPTFOO_DISABLE_TELEMETRY: "1"

      - name: Evaluar prompts - Pruebas ETA (Tarea B)
        run: |
          cd prompts/pruebas_eta
          promptfoo eval --config promptfooconfig.yaml --output /tmp/eval_pruebas_eta.json --no-cache
        env:
          PROMPTFOO_DISABLE_TELEMETRY: "1"

      - name: Compuerta de calidad
        run: python prompts/quality_gate.py

      - name: Subir resultados de evaluacion como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-eval-results
          path: |
            /tmp/eval_criterios.json
            /tmp/eval_pruebas_eta.json
          if-no-files-found: warn
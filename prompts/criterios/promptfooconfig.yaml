description: "Evaluacion de criterios de aceptacion INVEST para RutaSIT Arequipa"

prompts:
  - "file://v1.txt"

providers:
  - id: "file://../proveedor_grabado.py"
    label: "asistente-grabado"

defaultTest:
  assert:
    - type: is-json
      value: file://esquema.json
      metric: A1_contrato_json

    - type: javascript
      metric: A2_exito_y_error
      value: |
        let d;
        try {
          d = JSON.parse(output);
        } catch (e) {
          return false;
        }
        if (d.invest_ok === false) return true;
        if (d.invest_ok === true && Array.isArray(d.escenarios)) {
          const tieneExito = d.escenarios.some(e => e && e.tipo === 'exito');
          const tieneErrorOBorde = d.escenarios.some(e => e && (e.tipo === 'error' || e.tipo === 'borde'));
          return tieneExito && tieneErrorOBorde;
        }
        return false;

    - type: javascript
      metric: A3_sin_implementacion
      value: |
        const prohibidas = ['postgresql', 'redis', 'react', 'django', 'endpoint', 'tabla', 'api de', 'base de datos', 'b-tree', 'websocket'];
        let texto = output;
        try {
          const d = JSON.parse(output);
          if (d && Array.isArray(d.escenarios)) {
            texto = JSON.stringify(d.escenarios);
          }
        } catch (e) {
          texto = output;
        }
        const bajo = String(texto).toLowerCase();
        return !prohibidas.some(p => bajo.includes(p));

tests: file://casos.yaml

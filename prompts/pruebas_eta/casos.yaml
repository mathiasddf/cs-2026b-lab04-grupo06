      }

- description: "C5 | Borde/Error (Velocidad cero/negativa y distancia cero) | Verificar manejo seguro cuando velocidad_kmh <= 0 o distancia_km == 0 sin ZeroDivisionError."
  vars:
    id: "C5"
    historia: |
      Contexto técnico RutaSIT (`src/consultas/estrategias_eta.py`):
      Firma: `calcular_minutos(distancia_km: float, velocidad_kmh: float) -> float` y `EstrategiaETA.calcular(distancia_km, velocidad_kmh) -> float` (protege contra división por cero usando piso mínimo de velocidad `max(velocidad_kmh, 15.0)`, retorna `0.0` si `distancia_km == 0`, y lanza `ValueError` si `distancia_km < 0`).
      Criterios Gherkin de entrada (salida Tarea A):
      {
        "historia_id": "H1",
        "invest_ok": true,
        "escenarios": [
          {
            "titulo": "Velocidad cero o negativa no provoca ZeroDivisionError",
            "tipo": "borde",
            "dado": ["un bus detenido en semáforo de Av. Ejército reporta velocidad_kmh = 0.0 o -5.0 a 3.0 km del paradero"],
            "cuando": "se invoca calcular_minutos(3.0, 0.0) o calcular_minutos(3.0, -5.0)",
            "entonces": ["el sistema aplica el piso seguro de velocidad (15.0 km/h) y devuelve 12.0 minutos sin lanzar ZeroDivisionError"]
          },
          {
            "titulo": "Distancia cero al paradero destino y distancia negativa inválida",
            "tipo": "error",
            "dado": ["un bus que ya llegó al paradero (distancia_km = 0.0) y una lectura corrupta con distancia_km = -2.0"],
            "cuando": "se calcula el tiempo de llegada",
            "entonces": ["con distancia 0.0 retorna 0.0 minutos", "con distancia negativa lanza ValueError"]
          }
        ]
      }

- description: "C6 | No testeable (ambiguo) | Criterio ambiguo sin reglas ni valores verificables: Esperado es_testeable=false, observaciones>=1, pruebas=[], codigo_pytest=''."
  vars:
    id: "C6"
    historia: |
      Contexto técnico RutaSIT (`src/consultas/estrategias_eta.py`): `calcular_minutos(distancia_km, velocidad_kmh)` y `EstrategiaETA`.
      Criterio recibido:
      "Que el algoritmo de llegada se sienta mágico, agradable y moderno para el ciudadano"
  assert:
    - type: javascript
      metric: B4_rechaza_no_testeable
      value: |
        let d;
        try {
          d = JSON.parse(output);
        } catch (e) {
          return false;
        }
        return d.es_testeable === false && Array.isArray(d.observaciones) && d.observaciones.length >= 1 && Array.isArray(d.pruebas) && d.pruebas.length === 0 && d.codigo_pytest === "";

- description: "C7 | No testeable (infraestructura externa) | Tarea de infraestructura no unitaria: Esperado es_testeable=false, observaciones>=1, pruebas=[], codigo_pytest=''."
  vars:

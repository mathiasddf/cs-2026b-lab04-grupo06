- description: "C4 | Normal (Penalización por anomalías en ruta) | Escenarios de incremento de ETA cuando el bus reporta anomalías o desvíos."
  vars:
    id: "C4"
    historia: |
      Contexto técnico RutaSIT (`src/consultas/estrategias_eta.py` y `src/consultas/servicio.py`):
      Firma: `calcular_minutos(distancia_km: float, velocidad_kmh: float, es_anomalo: bool = False) -> float` y `EstrategiaETA` (si `es_anomalo` es verdadero por desvío o detención prolongada, suma una penalización fija de `+8.0` minutos al ETA base).
      Criterios Gherkin de entrada (salida Tarea A):
      {
        "historia_id": "H3",
        "invest_ok": true,
        "escenarios": [
          {
            "titulo": "Incremento de ETA cuando el bus reporta desvío autorizado",
            "tipo": "exito",
            "dado": ["un bus a 6.0 km y 30.0 km/h (12.0 min base) cambia al estado DESVIADO por obras en Tiabaya"],

- description: "C1 | Normal (ETA en flujo libre) | Encadenamiento Tarea A -> B para EstrategiaFlujoLibre: éxito con distancia y velocidad normales, y borde con distancia corta."
  vars:
    id: "C1"
    historia: |
      Contexto técnico RutaSIT (`src/consultas/estrategias_eta.py`):
      Firma: `calcular_minutos(distancia_km: float, velocidad_kmh: float) -> float` y contrato `EstrategiaETA.calcular(distancia_km, velocidad_kmh) -> float` (`EstrategiaFlujoLibre`: `minutos = (distancia_km / max(velocidad_kmh, 15.0)) * 60.0`).
      Criterios Gherkin de entrada (salida Tarea A):
      {
        "historia_id": "H1",
        "invest_ok": true,
        "escenarios": [
          {
            "titulo": "Cálculo de ETA en flujo libre con distancia y velocidad normales",
            "tipo": "exito",
            "dado": ["un bus de Conecta se encuentra a 6.0 km del paradero Plaza Cayma", "la velocidad promedio en flujo libre es 30.0 km/h"],
            "cuando": "se calcula el tiempo estimado de llegada con EstrategiaFlujoLibre",
            "entonces": ["el ETA calculado es exactamente 12.0 minutos"]
          },
          {
            "titulo": "Cálculo de ETA en flujo libre con distancia corta cercana al paradero",
            "tipo": "borde",
            "dado": ["el bus se encuentra a 0.5 km del paradero Óvalo Quiñones", "circula a 30.0 km/h en flujo libre"],
            "cuando": "se invoca calcular_minutos(0.5, 30.0)",
            "entonces": ["el ETA resultante es 1.0 minuto y mayor que cero"]
          }
        ]
      }

